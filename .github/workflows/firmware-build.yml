# Builds the FireBeetle 2 ESP32-P4 firmware (firmware/esp32p4) with ESP-IDF 5.5.6 and uploads it as
# the artifact `firmware`. File names carry the board, as other boards will have their own builds:
#   stadiacast-dongle-firebeetle2-esp32p4.bin       the app image, for the web console's updates
#   stadiacast-dongle-firebeetle2-esp32p4-full.bin  the whole flash, for a first install at 0x0
#                                                   over the programming port
#   firmware.json                                   board, version, commit, file names, sizes, SHA-256
# Called by console-pages.yml (pull requests and main, for GitHub Pages) and release.yml (tags).
name: Firmware build

on:
  workflow_call:
    inputs:
      version:
        description: The app's version string (at most 31 characters); empty for YYYY.MM.DD-<commit>
        type: string
        default: ""

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ESP-IDF 5.5.2 or later: earlier ones cannot build for the FireBeetle's v1.x P4
    # (CONFIG_ESP32P4_SELECTS_REV_LESS_V3). 5.5.6, as on the PC the board is tested from: a 5.5.4
    # build failed on the board in mbedtls_ecp_gen_key (-0x4d00, ECP random failed), so the
    # DTLS certificate and the controller's servers never came up.
    container: espressif/idf:v5.5.6
    env:
      BOARD: firebeetle2-esp32p4 # in the file names and firmware.json
    defaults:
      run:
        shell: bash
        working-directory: firmware/esp32p4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # libopus
      - name: version
        env:
          VERSION_IN: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory '*'
          version="${VERSION_IN:-$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)}"
          echo "$version" > version.txt # the app's version string (esp_app_desc_t.version)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Components from the registry, as on the PC (main/idf_component.yml). The component manager
      # in the IDF 5.5.4 image refused the registry's esp_hosted 2.13.1 (its dependency rules
      # name Kconfig options no Kconfig defines: "Missing required kconfig option after retry").
      # If that happens again, the three components come from their git repositories at the same
      # versions, without the manager; firmware.json says which way it was built.
      - name: build
        run: |
          . "$IDF_PATH/export.sh"
          if idf.py set-target esp32p4 && idf.py build; then
            echo "COMPONENTS=registry" >> "$GITHUB_ENV"
            x=
          else
            echo "::warning::the component registry build failed: building with components from git"
            v=/tmp/vend
            git clone -q --depth 1 -b v2.13.1 --recurse-submodules --shallow-submodules https://github.com/espressif/esp-hosted-mcu.git $v/esp_hosted
            git clone -q --depth 1 -b wifi_remote-v1.6.5 https://github.com/espressif/esp-wifi-remote.git $v/esp-wifi-remote
            git init -q $v/esp-usb && git -C $v/esp-usb fetch -q --depth 1 https://github.com/espressif/esp-usb.git 7d9431146f9078ebe4f0ac94e9a69e88cee64deb && git -C $v/esp-usb checkout -q FETCH_HEAD # esp_tinyusb 3.0.1
            git clone -q --depth 1 -b v0.21.0.6 https://github.com/espressif/tinyusb.git $v/esp-usb/device/esp_tinyusb/tinyusb
            mkdir -p $v/comps
            ln -s $v/esp_hosted $v/comps/esp_hosted
            ln -s $v/esp-wifi-remote/components/esp_wifi_remote $v/comps/esp_wifi_remote
            ln -s $v/esp-usb/device/esp_tinyusb $v/comps/esp_tinyusb
            rm -rf main/idf_component.yml dependencies.lock managed_components build sdkconfig
            sed -i 's/PRIV_REQUIRES /PRIV_REQUIRES esp_hosted esp_wifi_remote /' main/CMakeLists.txt
            export IDF_COMPONENT_MANAGER=0
            echo "COMPONENTS=git" >> "$GITHUB_ENV"
            x=-DEXTRA_COMPONENT_DIRS=$v/comps
            idf.py $x set-target esp32p4
            idf.py $x build
          fi
          idf.py $x merge-bin -o stadiacast-dongle-full.bin
          echo "IDF=$(idf.py --version)" >> "$GITHUB_ENV"
      - name: collect
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/stadiacast_dongle.bin "$GITHUB_WORKSPACE/out/stadiacast-dongle-$BOARD.bin"
          cp build/stadiacast-dongle-full.bin "$GITHUB_WORKSPACE/out/stadiacast-dongle-$BOARD-full.bin"
          cd "$GITHUB_WORKSPACE/out"
          python3 - <<'PY'
          import hashlib, json, os, datetime
          def f(name):
              d = open(name, "rb").read()
              return {"file": name, "size": len(d), "sha256": hashlib.sha256(d).hexdigest()}
          board = os.environ["BOARD"]
          json.dump({
              "board": board,
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ"),
              "idf": os.environ.get("IDF", ""),
              "components": os.environ.get("COMPONENTS", ""),
              "app": f(f"stadiacast-dongle-{board}.bin"),
              "full": f(f"stadiacast-dongle-{board}-full.bin"),
          }, open("firmware.json", "w"), indent=1)
          PY
          cat firmware.json
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/
          if-no-files-found: error
