# A GitHub release for each version tag: push a tag such as v1.0.0 on main and this builds the
# firmware at that commit (the same build as GitHub Pages, firmware-build.yml, with the tag as the
# app's version) and publishes it as a release with short notes:
#   stadiacast-dongle-<board>-full.bin  the whole flash, for a first install at 0x0 over the
#                                       programming port
#   stadiacast-dongle-<board>.bin       the app image, for the web console's "Install a .bin file"
#   firmware-<board>.json, SHA256SUMS   board, version, commit, ESP-IDF, sizes and checksums
# <board> is firebeetle2-esp32p4 for now; each board's build will add its own files.
# A tag with a hyphen (v1.1.0-rc1) makes a pre-release. A full release then redeploys GitHub Pages,
# so the web console's "Install latest" offers it (a pre-release doesn't). Running it again for the
# same tag replaces the files and keeps the notes.
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    uses: ./.github/workflows/firmware-build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to start the Pages deploy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out
      - name: notes
        working-directory: out
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          board="$(python3 -c 'import json; print(json.load(open("firmware.json"))["board"])')"
          mv firmware.json "firmware-$board.json"
          sha256sum stadiacast-dongle-*.bin > SHA256SUMS
          export BOARD="$board"
          python3 - <<'PY'
          import json, os
          fw = json.load(open(f"firmware-{os.environ['BOARD']}.json"))
          full, app = fw["full"]["file"], fw["app"]["file"]
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          pages = "https://dinoyoshi.github.io/stadiacast-dongle/"
          guide = f"https://github.com/{repo}/blob/{tag}/firmware/esp32p4/README.md"
          trouble = f"https://github.com/{repo}/blob/{tag}/firmware/esp32p4/docs/troubleshooting.md"
          progress = f"https://github.com/{repo}/blob/{tag}/firmware/esp32p4/docs/progress.md"
          idf = fw.get("idf", "").replace("ESP-IDF ", "")
          lines = [
              f"Firmware for the **DFRobot FireBeetle 2 ESP32-P4**, version `{fw['version']}` "
              f"(commit `{fw['commit'][:7]}`, ESP-IDF {idf}, built {fw['built']}).",
              "",
              f"**First install:** write `{full}` at address `0x0` over the board's "
              "programming USB-C port, with [ESP Web Tool](https://espressif.github.io/esptool-js/) "
              f"or `esptool --chip esp32p4 write_flash 0x0 {full}`. Then use the "
              "other port (high-speed OTG) and the [web console](" + pages + ").",
              "",
              "**Already running the dongle:** in the web console's Update firmware card, "
              f"**Install a .bin file** and pick `{app}`. It rolls back by itself if "
              "the new firmware doesn't start.",
              "",
              "Built for the FireBeetle's v1.x P4 chip. What was tested on hardware is in "
              f"[progress.md]({progress}); if something goes wrong, see [troubleshooting]({trouble}) "
              f"and the [user guide]({guide}).",
              "",
              "| file | size | SHA-256 |",
              "|---|---|---|",
          ]
          for k in ("full", "app"):
              f = fw[k]
              lines.append(f"| `{f['file']}` | {f['size']:,} bytes | `{f['sha256']}` |")
          open("notes.md", "w").write("\n".join(lines) + "\n")
          PY
          cat notes.md
      - name: publish
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files="$(ls stadiacast-dongle-*.bin firmware-*.json) SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            pre=
            case "$TAG" in *-*) pre=--prerelease ;; esac
            gh release create "$TAG" $files $pre --verify-tag --title "$TAG" \
              --notes-file notes.md --generate-notes
          fi
      # A release made with this workflow's token starts no other workflow by itself (GitHub's
      # rule), so start the Pages deploy here, now that the release has its files.
      - name: GitHub Pages
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run console-pages.yml --ref main
