# The dongle's web console (firmware/esp32p4/console/) on GitHub Pages, with the firmware next to
# it: the console's "Update firmware" card installs firmware/stadiacast-dongle.bin from the same
# site (same origin, so no CORS), and firmware/stadiacast-dongle-full.bin is the whole flash for a
# first install over the programming port.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Pull requests only build the firmware, which checks that it compiles.
name: Web console and firmware (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - firmware/esp32p4/**
      - firmware/core/**
      - firmware/platform/**
      - .github/workflows/console-pages.yml
      - .github/workflows/firmware-build.yml
  pull_request:
    paths:
      - firmware/esp32p4/**
      - firmware/core/**
      - firmware/platform/**
      - .github/workflows/console-pages.yml
      - .github/workflows/firmware-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    uses: ./.github/workflows/firmware-build.yml

  deploy:
    if: github.event_name != 'pull_request'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: the console
        run: cp -r firmware/esp32p4/console site
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: site/firmware
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
