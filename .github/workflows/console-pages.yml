# The dongle's web console (firmware/esp32p4/console/) on GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Web console (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - firmware/esp32p4/console/**
      - .github/workflows/console-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: firmware/esp32p4/console
      - id: deployment
        uses: actions/deploy-pages@v4
