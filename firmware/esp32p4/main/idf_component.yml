## The C6 on the FireBeetle 2 ESP32-P4 gives the P4 its Wi-Fi through ESP-Hosted over SDIO.
## esp_wifi_remote makes the normal esp_wifi_* calls run on the C6.
dependencies:
  idf:
    version: ">=5.5.0"
  espressif/esp_wifi_remote:
    version: "~1.6.5"
  espressif/esp_hosted:
    version: "~2.13.1"
  ## TinyUSB for the USB gamepad (components/usb_pad) on the P4's high-speed USB-C port.
  espressif/esp_tinyusb:
    version: "^3.0.0"
